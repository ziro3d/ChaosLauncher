name: Auto Update version.json on Release

on:
  release:
    types: [published]

jobs:
  update-version-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to main branch
        run: |
          git checkout main || git checkout -b main

      - name: Update version.json
        run: |
          # Получаем чистый номер версии без буквы 'v'
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          
          # Находим ссылку на загруженный zip-архив
          DOWNLOAD_URL="${{ github.event.release.assets[0].browser_download_url }}"
          
          # Получаем описание релиза (Changelog)
          BODY="${{ github.event.release.body }}"
          
          if [ -z "$BODY" ]; then
            BODY="• Release $TAG_NAME updates"
          fi

          # Формируем валидный JSON
          cat <<EOF > version.json
          {
            "Version": "$VERSION",
            "DownloadUrl": "$DOWNLOAD_URL",
            "Changelog": $(echo "$BODY" | jq -R -s '.')
          }
          EOF

      - name: Commit and Push version.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update version.json for release ${{ github.event.release.tag_name }}"
          file_pattern: version.json
          branch: main

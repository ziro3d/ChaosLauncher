name: Auto Update version.json on Release

on:
  release:
    types: [published]

jobs:
  update-version-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version.json
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          DOWNLOAD_URL="${{ github.event.release.assets[0].browser_download_url }}"
          BODY="${{ github.event.release.body }}"
          
          if [ -z "$BODY" ]; then
            BODY="• Release $TAG_NAME updates"
          fi

          cat <<EOF > version.json
          {
            "Version": "$VERSION",
            "DownloadUrl": "$DOWNLOAD_URL",
            "Changelog": $(echo "$BODY" | jq -R -s '.')
          }
          EOF

      - name: Commit and Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "auto: update version.json for release ${{ github.event.release.tag_name }}" || exit 0
          git push origin main
